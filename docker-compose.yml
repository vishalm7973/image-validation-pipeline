services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aragon_images
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aragon_images"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports: ["6379:6379"]
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/aragon_images?schema=public}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      PORT: ${PORT:-4000}
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/uploads}
      MAX_FILE_MB: ${MAX_FILE_MB:-15}
      MIN_WIDTH: ${MIN_WIDTH:-400}
      MIN_HEIGHT: ${MIN_HEIGHT:-400}
      MIN_FACE_RATIO: ${MIN_FACE_RATIO:-0.12}
      BLUR_THRESHOLD: ${BLUR_THRESHOLD:-35}
      PHASH_DISTANCE_THRESHOLD: ${PHASH_DISTANCE_THRESHOLD:-8}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    ports: ["4000:4000"]
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["sh", "-c", "npx prisma migrate deploy && node dist/api.js"]
  worker:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/aragon_images?schema=public}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/uploads}
      MAX_FILE_MB: ${MAX_FILE_MB:-15}
      MIN_WIDTH: ${MIN_WIDTH:-400}
      MIN_HEIGHT: ${MIN_HEIGHT:-400}
      MIN_FACE_RATIO: ${MIN_FACE_RATIO:-0.12}
      BLUR_THRESHOLD: ${BLUR_THRESHOLD:-35}
      PHASH_DISTANCE_THRESHOLD: ${PHASH_DISTANCE_THRESHOLD:-8}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["node", "dist/worker.js"]
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports: ["5173:80"]
    depends_on: [api]
volumes:
  postgres_data:
  redis_data:
  uploads_data:
